AutoName: LendLog
Summary: Personal lending and borrowing tracker
Description: |-
  LendLog is a clean, private, and fully offline personal lending and
  borrowing tracker. Keep track of money lent to or borrowed from friends,
  family, and colleagues without creating an account or storing data on
  any remote server.

  * Track Lend & Borrow Records: Record transactions with amount, date,
    due date, person name, and custom notes.
  * Partial & Full Repayments: Log payments incrementally against open records
    until fully settled.
  * People Directory: View net balances per person at a glance to know who
    owes you and whom you owe.
  * Live Balance Calculations: Instantly monitor total lent, total borrowed,
    and your current net balance.
  * Analytics & Insights: Review 6-month lending trends, settlement rates,
    and creditor/debtor rankings.
  * Local Data Backup & Restore: Export your complete transaction history to JSON
    and restore whenever needed.
  * Multi-currency support and dark/light themes.
  * 100% Private & Offline: Operates entirely on-device with zero tracking,
    zero ads, and zero cloud dependencies.

RepoType: git
Repo: https://github.com/kaixhdev/lendlog.git

Builds:
  - versionName: 1.0.1
    versionCode: 2
    commit: v1.0.1
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - cd ../..
      - npm ci
    prebuild:
      - cd ../..
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    gradle:
      - yes
    output: build/outputs/apk/release/app-release-unsigned.apk
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
    scandelete:
      - node_modules/

