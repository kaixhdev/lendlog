name: Refresh dependency lockfile

on:
  push:
    branches: [ci/eslint-prettier]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.head_commit.message != 'chore: refresh lockfile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/eslint-prettier
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh lockfile"
            git push
          fi
